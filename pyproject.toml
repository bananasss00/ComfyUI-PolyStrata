[project]
name = "comfyui-polystrata"
description = "ComfyUI nodes for a self-hosted PolyStrata server: compact Schema-V3 chat (comfy_api.latest, NO model/api_key/extra_mib widgets - the server's loaded model is used) with autogrow image pins (img_*) and separate video pins (vid_*, each pin = one video as sequential frames), optional Media subnode for per-pin frame limits (max_frame_side/max_images/max_video_frames/video_fps) with engine-context preflight, top_k in chat after top_p, text+thoughts outputs, ComfyUI Cancel/interrupt support, no streaming; clear_comfy_vram toggle unloads ComfyUI's own models before generation (once per workflow run - lists/loops/seeds do not free memory twice) and list inputs are handled safely via a universal normalizer (no hardcoded widget names: scalars take the first element, image lists expand to pins); sampling subnode without duplicates (min_p/penalties/stop/logit_bias/extra_sampling); Memory history; single reserve_mib writes the server's ACTUAL usage into ComfyUI EXTRA_RESERVED_VRAM (llama.cpp-nodes method); pass-through full-unload restores it. Strata-poly 0.1.45-poly.6+, no config keys, model loads on demand."
version = "0.8.0"
license = { text = "MIT" }
dependencies = ["requests"]

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI PolyStrata"
Icon = ""
Tags = ["llm", "polystrata", "chat", "vram", "video", "schema-v3", "interrupt", "timestamps"]
