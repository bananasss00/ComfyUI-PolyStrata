[project]
name = "comfyui-polystrata"
description = "ComfyUI nodes for a self-hosted PolyStrata server: compact Schema-V3 chat (comfy_api.latest, NO api_key/extra_mib widgets - the server's loaded model is used) with a model dropdown that lists the server's INSTALLED models (GET /api/models, strata-*.json registry; refreshed on browser reload F5 or the R hotkey, 15 s cache) and switches the server at runtime BEFORE generation (POST /api/models/load: the running engine stops, the new model loads by its own strata-<model>.json config; 'as on server' sentinel keeps the loaded model and sends no 'model' field), autogrow image pins (img_*) and separate video pins (vid_*, each pin = one video as sequential frames), optional Media subnode for per-pin frame limits (max_frame_side/max_images/max_video_frames/video_fps) with engine-context preflight, top_k in chat after top_p, text+thoughts outputs, ComfyUI Cancel/interrupt support, no streaming; clear_comfy_vram toggle unloads ComfyUI's own models before generation (once per workflow run) and list inputs are handled safely via a universal normalizer; sampling subnode without duplicates (min_p/penalties/stop/logit_bias/extra_sampling); Memory history; single reserve_mib writes the server's ACTUAL usage into ComfyUI EXTRA_RESERVED_VRAM (llama.cpp-nodes method); pass-through full-unload restores it. Strata-poly 0.1.45-poly.6+, no config keys, model loads on demand. v0.9.1: positional widgets_values of saved workflows are migrated on load by a JS extension (WEB_DIRECTORY js/polystrata_migration.js: beforeRegisterNodeDef wraps configure and rewrites pre-0.9 arrays to the current layout via an anchor-based detector), so old v0.8 workflows keep every widget value after the model dropdown was inserted into PolyStrataChat."
version = "0.9.1"
license = { text = "MIT" }
dependencies = ["requests"]

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI PolyStrata"
Icon = ""
Tags = ["llm", "polystrata", "chat", "vram", "video", "schema-v3", "interrupt", "timestamps"]
